name: cPanel release source verification

# Production publication is deliberately manual now. This compatibility
# workflow verifies a published release but never rebuilds or writes
# cpanel-release; use cpanel-promote.yml after staging acceptance.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published vX.Y.Z release tag to verify'
        required: true
        type: string
      source_commit:
        description: 'Expected full main commit'
        required: true
        type: string

permissions:
  contents: read
  checks: read

jobs:
  verify:
    name: Verify release source before manual promotion
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify tag and protected checks
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${EVENT_TAG:-$INPUT_TAG}"
          git fetch origin main --tags
          source="$(git rev-list -n 1 "${tag}^{commit}")"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then [[ "$source" == "$INPUT_COMMIT" ]]; fi
          git merge-base --is-ancestor "$source" origin/main
          echo "Verified $tag at $source. No production artifact was published; owner acceptance and cpanel-promote.yml are required."
      - name: Require all protected checks on source commit
        uses: actions/github-script@v7
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const tag = process.env.EVENT_TAG || process.env.INPUT_TAG;
            const source = (await github.rest.repos.getCommit({owner: context.repo.owner, repo: context.repo.repo, ref: tag})).data.sha;
            const required = ['Dependencies', 'Backend tests', 'Frontend build', 'Browser QA'];
            const runs = await github.paginate(github.rest.checks.listForRef, {owner: context.repo.owner, repo: context.repo.repo, ref: source, per_page: 100});
            const missing = required.filter((name) => !runs.some((run) => run.name === name && run.conclusion === 'success'));
            if (missing.length) core.setFailed(`Protected CI is not green: ${missing.join(', ')}`);
